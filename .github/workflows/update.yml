name: Update forecasts

on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - name: Save changes
        run: |
          git config user.name "btc-predictor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs output
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "Update data and forecasts $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -X theirs origin main
            git push
          fi
